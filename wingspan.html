<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tools | Wingspan Scoring Calculator</title>
    <link rel="stylesheet" href="style.css">
<style>
    * {
        margin: 0;
        padding: 0;
        transition: all .5s;
    }
    .gameTitle {
        margin: 2rem 0 2rem 0;
        transform: scale(1,1.8);
        color: white;
        font-size: 5rem;
        letter-spacing: .5rem;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
    }
    body {
        background-image: url(images/wingspanBackground.jpeg);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100vh;
    }
    #addPlayerButton {
        margin: 0 3rem 0 3rem;
        background-color: rgba(255, 255, 255, 0.204);
        padding: 10px;
        border-radius: 15px;
        border: 2px solid black;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        margin-bottom: 1rem;
    }
    #addPlayerButton:hover {
        background-color: rgba(255, 255, 255, 0.368);
    }
    #tableContainer {
        padding: 0 3rem 0 3rem;
    }
    table, th, td {
        border:1.5px solid black;
        border-collapse: collapse;
        background-color: rgba(255, 255, 255, 0.14);
    }
    th, td {
        text-align: left;
        padding-left: 1rem
    }
    table {
        width: 100%;
        table-layout: fixed;
        box-sizing: border-box;
        padding: 200px;
    }
    td input {
        width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border: none;
        text-align: left;
        background-color: transparent;
        
    }
    th input {
        border: none;
        margin: 0;
        padding: 0;
        background-color: transparent;
        font-weight: bold;
    }
    td input:focus, th input:focus {
        outline: none;
    }
    th button {
        float: right;
        border: none;
        background-color: transparent;
        font-weight: bold;
        margin-right: 5px;
    }
    </style>
</head>

<body>
    <nav>
        <div class="navIcon">
            <i class="fa-solid fa-dice"></i>
            Game Tools
        </div>
        <div class="navLinks">
            <a href="index.html" class="active">Home</a>
            <div class="dropdown">
                <button class="dropdownButton">Scoring Calculators
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="dropdown-content">
                    <a href="wingspan.html">Wingspan</a>
                    <a href="#">Finspan</a>
                    <a href="#">Quixx</a>
                </div>
            </div>
        </div>
    </nav>
    <h1 class="gameTitle">WINGSPAN</h1>
    <button id="addPlayerButton">Add Player</button>
    <div id="tableContainer">
        <table id="table">
            <tr id="playerRow">
                <th></th>
               
            </tr>
            <tr id="birdScore">
                <th>Birds</th>
                
            </tr>
            <tr id="bonusScore">
                <th>Bonus Cards</th>
            </tr>
            <tr id="endOfRoundScore">
                <th>End-Of-Round Goals</th>
            </tr>
            <tr id="eggsScore">
                <th>Eggs</th>
            </tr>
            <tr id="foodScore">
                <th>Food On Cards</th>
            </tr>
            <tr id="tuckedScore">
                <th>Tucked Cards</th>
            </tr>
            <tr id="nectarScore">
                <th>Nectar</th>
            </tr>
            <tr id="totalScore">
                <th>TOTAL</th>
            </tr>
        </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
