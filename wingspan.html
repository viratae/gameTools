<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tools | Wingspan Scoring Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" size="16x16" href="images/dice.png">
    <script src="https://kit.fontawesome.com/b8659964f9.js" crossorigin="anonymous"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        transition: all .5s;
    }
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: #00000066;
    }
    .modalContent {
        padding: 30px;
        background-color: white;
        border-radius: 10px;
        width: 300px;
    }
    .modal.show {
        display: flex;
    }
    #closeModal {
        font-size: 20px;
        font-weight: bold;
        display: block;
        text-align: right;
        user-select: none; 
        cursor: pointer;
        margin-bottom: 2vh;
    }
    form button {
        border: none;
        font-weight: bold;
        padding: 10px;
        border-radius: 5px;
        background-color: rgb(202, 202, 202);
        margin-top: 5px;
        font-size: 1rem;
    }
    form > div {
        display: flex;
        justify-content: space-between;
    }
    form p {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1rem;
    }
    label {
        display: inline-block;
        width: 200px;
        font-weight: bold;
        margin-top: 4px;
    }
    form input {
        width: 25px;
        padding-left: 3px;
    }
    form input:focus {
        outline: none;
    }
    .gameTitle {
        margin: 2rem 0 2rem 0;
        transform: scale(1,1.8);
        color: white;
        font-size: 5rem;
        letter-spacing: .5rem;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
    }
    body {
        background-image: linear-gradient(rgba(181, 211, 201, 0.4), rgba(134, 143, 173, 0.15)), url(images/wingspanBackground.jpeg);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100vh;
    }
    #buttonWrapper {
        margin-left: 3rem;
        display: flex;
        gap: 1rem;
    }
    #addPlayerButton,
    #changeWeightButton {
        background-color: rgba(255, 255, 255, 0.204);
        padding: 10px;
        border-radius: 15px;
        border: 2px solid black;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        margin-bottom: 1rem;
    }
    #addPlayerButton:hover {
        background-color: rgba(255, 255, 255, 0.368);
    }
    #tableContainer {
        padding: 0 3rem 0 3rem;
        overflow-x: auto;
    }
    table, th, td {
        border:1.5px solid black;
        border-collapse: collapse;
        background-color: rgba(255, 255, 255, 0.14);
    }
    #table th:first-child {
        min-width: 150px;
    }
    th, td {
        text-align: left;
        padding-left: 1rem
    }
    
    table {
        width: 100%;
        
        box-sizing: border-box;
        padding: 200px;
    }
    td input {
        width: 100%;
        max-width: 120px;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border: none;
        text-align: left;
        background-color: transparent;
    }
    th input {
        border: none;
        max-width: 120px;
        margin: 0;
        padding: 0;
        background-color: transparent;
        font-weight: bold;
    }
    td input:focus, th input:focus {
        outline: none;
    }
    th, th button {
        vertical-align: top;
        
    }
    
    th {
        position: relative;
    }

    th button {
        position: absolute;
        right: 6px;
        top: 1px;
        border: none;
        background-color: transparent;
        font-weight: bold;
    }
    
    @media screen and (max-width: 500px){
    .gameTitle {
        font-size: 3rem;
    }
    td input, th input {
        max-width: 80px;
    }
    #table th:first-child {
        min-width: 100px;
    }
    #tableContainer {
        padding: 0 1rem 0 1rem;
        overflow-x: auto;
    }
    @media screen and (max-width: 480px){
        .navIcon {
            display: none;
        }
     }
    @media screen and (max-width: 400px){
        header h1 {
            font-size: 2rem;
        }
        header h3 {
            font-size: 1rem;
        }
        
        .navLinks {
            flex-direction: column;
        }
    }
}
    </style>
</head>

<body>
    <div class="modal">
            <div class="modalContent">
                <span id="closeModal">&times;</span>
                <form id="weightingForm" autocomplete="off">
                    <p>Change any of these values to change their score multipliers. For example, setting "Eggs" to 2 doubles the value of each egg.</p>
                    <div>
                        <label for="birds">Birds:</label>
                        <input id="birds" value="1" type="number" />
                    </div>
                    <div>
                        <label for="bonus">Bonus Cards:</label>
                        <input id="bonus" value="1" type="number" />
                    </div>
                    <div>
                        <label for="endOfRound">End-Of-Round Cards:</label>
                        <input id="endOfRound" value="1" type="number" />
                    </div>
                    <div>
                        <label for="eggs">Eggs:</label>
                        <input id="eggs" value="1" type="number" />
                    </div>
                    <div>
                        <label for="food">Food on Cards:</label>
                        <input id="food" value="1" type="number" />
                    </div>
                    <div>
                        <label for="tucked">Tucked Cards:</label>
                        <input id="tucked" value="1" type="number" />
                    </div>
                    <div>
                        <label for="nectar">Nectar:</label>
                        <input id="nectar" value="1" type="number" />
                    </div>
                    <div id="buttonContainer">
                        <button id="submitButton" type="submit">Update Weightings</button>
                    </div>
                </form>
            </div>
        </div>
    <nav>
        <div class="navIcon">
            <i class="fa-solid fa-dice"></i>
            <a href="index.html">Game Tools</a>
        </div>
        <div class="navLinks">
            <a href="index.html" class="active">Home</a>
            <div class="dropdown">
                <button class="dropdownButton">Scoring Calculators
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="dropdown-content">
                    <a href="wingspan.html">Wingspan</a>
                    <a href="#">Finspan</a>
                    <a href="#">Quixx</a>
                </div>
            </div>
        </div>
    </nav>
    <h1 class="gameTitle">WINGSPAN</h1>
    <div id="buttonWrapper">
        <button id="addPlayerButton">Add Player</button>
        <button id="changeWeightButton">Change Score Weighting</button>
    </div>
    <div id="tableContainer">
        <table id="table">
            <tr id="playerRow">
                <th></th>
               
            </tr>
            <tr id="birdScore">
                <th>Birds</th>
                
            </tr>
            <tr id="bonusScore">
                <th>Bonus Cards</th>
            </tr>
            <tr id="endOfRoundScore">
                <th>End-Of-Round Goals</th>
            </tr>
            <tr id="eggsScore">
                <th>Eggs</th>
            </tr>
            <tr id="foodScore">
                <th>Food On Cards</th>
            </tr>
            <tr id="tuckedScore">
                <th>Tucked Cards</th>
            </tr>
            <tr id="nectarScore">
                <th>Nectar</th>
            </tr>
            <tr id="totalScore">
                <th>TOTAL</th>
            </tr>
        </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
